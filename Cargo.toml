[workspace]
resolver = "3"
members = [
    "crates/vortex-ng-autct",
    "crates/vortex-ng-channel",
    "crates/vortex-ng-core",
    "crates/vortex-ng-joinstr",
    "crates/vortex-ng-nostr",
    "crates/vortex-ng-wallet",
    "crates/vortex-ng-chain",
    "crates/vortex-ng-ln",
    "crates/vortex-ng-maker",
    "crates/vortex-ng-taker",
    "crates/vortex-ng-node",
    "crates/vortex-ngd",
    "crates/vortex-ng-cli",
    "tools/joinstr-difffuzz-adapter",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SovereignTechnology/vortex-ng"
publish = false

[workspace.dependencies]
vortex-ng-core = { path = "crates/vortex-ng-core" }
vortex-ng-autct = { path = "crates/vortex-ng-autct" }
vortex-ng-channel = { path = "crates/vortex-ng-channel" }
vortex-ng-joinstr = { path = "crates/vortex-ng-joinstr" }
vortex-ng-nostr = { path = "crates/vortex-ng-nostr" }
vortex-ng-wallet = { path = "crates/vortex-ng-wallet" }
vortex-ng-chain = { path = "crates/vortex-ng-chain" }
vortex-ng-ln = { path = "crates/vortex-ng-ln" }
vortex-ng-maker = { path = "crates/vortex-ng-maker" }
vortex-ng-taker = { path = "crates/vortex-ng-taker" }
vortex-ng-node = { path = "crates/vortex-ng-node" }

# Same pin as rbitcoin, so types and behaviour match the in-house reference node.
bitcoin = { version = "=0.32.102", default-features = false, features = ["std", "base64"] }
# NaCl crypto_box (Curve25519-XSalsa20-Poly1305), libsodium-compatible, as JoinMarket uses.
crypto_box = "0.9.1"
# rust-nostr 0.45.6 (2026-10-30): constant-time NIP-44 v2 HMAC check (security fix over 0.45.5). 0.45.7 only
# fixes a nip49 build we do not use.
nostr = { version = "=0.45.6", default-features = false, features = ["std", "os-rng", "nip04", "nip44", "nip59"] }
# rust-bitcoin's minimal JSON-RPC client (HTTP over TCP, basic auth) for Core-compatible nodes.
jsonrpc = "0.21.0"
serde_json = { version = "1", features = ["raw_value"] }
# rust-nostr's relay client. 0.45.6 (2026-11-03) is the only unyanked 0.45.x: 0.45.5/0.45.6 fix a
# verification-cache bypass. The 7-day rule is met from 2026-11-10.
nostr-sdk = { version = "=0.45.6" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
futures = "0.3"
# The aut-ct client (vortex-ng-autct). tokio-tungstenite is the version nostr-sdk already brings in, so there
# is one copy. argon2 and aes-gcm-siv are held one generation back on purpose: 0.6.0 and 0.12.1 are on
# RustCrypto's next generation (aead 0.6, cipher 0.5, digest 0.11) while crypto_box and nostr are on the
# current one, and taking them would put two copies of nine crypto crates in the tree. Move them together
# with crypto_box and nostr.
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "handshake"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }
# Wipes secrets (seed words, passwords, derived keys) from memory when dropped. Already in the tree through
# the crypto crates.
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
# Terminal modes without unsafe code, for a password prompt that does not echo. Already in the tree (tokio's
# and arti's file handling); the `termios` feature adds no crate.
rustix = { version = "1.1.6", default-features = false, features = ["std", "termios"] }
aes-gcm-siv = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
# Tor in-process (feature `tor` of vortex-ng-nostr). 0.47.0 (2026-10-01): newest release at least 7 days old.
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"] }
# Descriptor wallets (rust-bitcoin 0.32) with BIP39 seeds; synced from our own chain backend.
bdk_wallet = { version = "3.2.0", default-features = false, features = ["std", "keys-bip39"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "warn"

[profile.dev]
debug = "line-tables-only"

# Argon2 at the wallet file's cost (64 MiB, 3 passes) takes seconds unoptimized, and tests open several files.
[profile.dev.package.argon2]
opt-level = 3

[profile.test]
debug = "line-tables-only"

[profile.test.package.argon2]
opt-level = 3
