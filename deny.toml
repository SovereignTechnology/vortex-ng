# Supply-chain gate. CI: `cargo deny check`.
# Every exception needs a one-line reason in this file.

[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
unsound = "all"
unmaintained = "all"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",           # rust-bitcoin / hashes
    "MITNFA",            # hex_lit via bitcoin 0.32
]

[bans]
multiple-versions = "deny"
# `workspace = true` lines are reported as wildcards by cargo-deny 0.20; the tree has no `version = "*"`.
wildcards = "allow"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
