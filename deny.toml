# Supply-chain gate. CI: `cargo deny check`.
# Every exception needs a one-line reason in this file.

[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
unsound = "all"
unmaintained = "all"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",           # rust-bitcoin / hashes
    "MITNFA",            # hex_lit via bitcoin 0.32
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CA bundle) via nostr-sdk's TLS for wss:// relays
]

[bans]
multiple-versions = "deny"
# `workspace = true` lines are reported as wildcards by cargo-deny 0.20; the tree has no `version = "*"`.
wildcards = "allow"
deny = []
skip = [
    # rust-bitcoin 0.32 (pinned as rbitcoin pins it) and rust-nostr 0.45 are two secp256k1/hashes stacks.
    # vortex-ng-core uses the first, vortex-ng-nostr the second; keys cross as bytes. Until bitcoin 0.33.
    { name = "secp256k1", version = "=0.29.1" },        # bitcoin 0.32; nostr uses 0.30
    { name = "bitcoin_hashes", version = "=0.14.101" },  # bitcoin 0.32; nostr uses 1.x
    { name = "bitcoin-internals", version = "=0.6.0" },  # via nostr's bitcoin_hashes 1.2
    { name = "hex-conservative", version = "=0.2.3" },   # bitcoin 0.32; nostr side uses 1.x
    { name = "bech32", version = "=0.11.1" },            # bitcoin 0.32; nostr uses 0.12
    { name = "base64", version = "=0.21.7" },            # bitcoin's base64 feature; nostr uses 0.22
    # crypto_box 0.9 (RustCrypto aead 0.5) uses rand_core 0.6 / getrandom 0.2; rust-nostr uses rand 0.10.
    { name = "rand_core", version = "=0.6.4" },
    { name = "getrandom", version = "=0.2.17" },
    # secp256k1 0.29's rand feature (enabled by bdk_wallet) uses rand 0.8; rust-nostr uses rand 0.10.
    { name = "rand", version = "=0.8.8" },
    # nostr-sdk's WebSocket stack: tungstenite 0.28 uses rand 0.9 (getrandom 0.3, r-efi 5 on UEFI); tokio-socks
    # uses thiserror 1. Three rand generations meet here (bitcoin 0.8, tungstenite 0.9, nostr 0.10).
    { name = "rand", version = "=0.9.5" },
    { name = "rand_chacha", version = "=0.3.1" },
    { name = "rand_core", version = "=0.9.5" },
    { name = "getrandom", version = "=0.3.4" },
    { name = "r-efi", version = "=5.3.0" },
    { name = "thiserror", version = "=1.0.69" },
    { name = "thiserror-impl", version = "=1.0.69" },
    # Windows targets only: ring 0.17 (rustls for wss:// relays) still uses windows-sys 0.52; tokio uses 0.61.
    { name = "windows-sys", version = "=0.52.0" },
    # Build-time only: curve25519-dalek-derive (crypto_box) on syn 2; serde_derive, displaydoc and others on syn 3.
    { name = "syn", version = "=2.0.119" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
