# vortex-ng CI on the project's private GitLab mirror.
#
# DORMANT until the project is onboarded: builds are disabled on the GitLab project and no runner carries the
# `vortex-ng` tag yet. Tools are downloaded prebuilt and sha256-pinned, never compiled on the runner; the image
# is pinned by digest.

stages: [check]

default:
  tags: [vortex-ng]
  image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
  timeout: 30m
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_DENY_VERSION: "0.20.2"
  # Matches the release's own .sha256 file and GitHub's asset digest (as pinned in nfx).
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"

fmt:
  stage: check
  script:
    - cargo fmt --all -- --check

clippy:
  stage: check
  script:
    - cargo clippy --locked --workspace --all-targets -- -D warnings

test:
  stage: check
  script:
    - cargo test --locked --workspace

deny:
  stage: check
  script:
    - curl -sSfL --retry 8 --retry-all-errors -o /tmp/deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    - echo "${CARGO_DENY_SHA256}  /tmp/deny.tgz" | sha256sum -c -
    - tar -xzf /tmp/deny.tgz -C /tmp && install -m 0755 "/tmp/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/
    - cargo deny --locked check
