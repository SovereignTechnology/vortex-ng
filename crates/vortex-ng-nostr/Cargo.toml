[package]
name = "vortex-ng-nostr"
description = "The Nostr message channel for the JoinMarket protocol (JMP draft: Nostr message channel)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vortex-ng-core = { workspace = true }
nostr = { workspace = true }
nostr-sdk = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
arti-client = { workspace = true, optional = true }
tor-rtcompat = { workspace = true, optional = true }

[features]
# In-process Tor (arti): one isolated circuit set per nick behind a local SOCKS shim.
tor = ["dep:arti-client", "dep:tor-rtcompat"]

[dev-dependencies]
nostr-sdk = { workspace = true, features = ["local-relay"] }
