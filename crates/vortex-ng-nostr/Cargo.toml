[package]
name = "vortex-ng-nostr"
description = "The Nostr message channel for the JoinMarket protocol (JMP draft: Nostr message channel)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vortex-ng-core = { workspace = true }
vortex-ng-channel = { workspace = true }
nostr = { workspace = true }
nostr-sdk = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

[features]
# In-process Tor (arti): one isolated circuit set per nick behind a local SOCKS shim.
tor = ["vortex-ng-channel/tor"]
# Test helpers for other crates' tests (`vortex_ng_nostr::testing`). Never needed to run vortex-ng.
test-util = ["vortex-ng-channel/test-util"]

[dev-dependencies]
nostr-sdk = { workspace = true, features = ["local-relay"] }
vortex-ng-channel = { workspace = true, features = ["test-util"] }
