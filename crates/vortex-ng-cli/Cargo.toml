[package]
name = "vortex-ng-cli"
description = "vortex-ng command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vortex-ng-core = { workspace = true }
vortex-ng-wallet = { workspace = true }
vortex-ng-channel = { workspace = true }
vortex-ng-onion = { workspace = true }
vortex-ng-irc = { workspace = true }
vortex-ng-chain = { workspace = true }
vortex-ng-nostr = { workspace = true }
vortex-ng-maker = { workspace = true }
vortex-ng-taker = { workspace = true }
vortex-ng-node = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }
rustix = { workspace = true }

[[bin]]
name = "vortex-ng"
path = "src/main.rs"

[dev-dependencies]
nostr-sdk = { workspace = true, features = ["local-relay"] }
vortex-ng-nostr = { workspace = true, features = ["test-util"] }
vortex-ng-onion = { workspace = true, features = ["test-util"] }
vortex-ng-irc = { workspace = true, features = ["test-util"] }
